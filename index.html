<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Steam Boost Manager</title>
    <style>
        body { font-family: sans-serif; background: #1b2838; color: white; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: #2a475e; padding: 20px; border-radius: 5px; width: 400px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 3px; border: none; }
        button { background: #66c0f4; color: white; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-section">
            <h2>Site Access</h2>
            <input type="password" id="site-pass" placeholder="Enter Site Password">
            <button onclick="checkPass()">Login</button>
        </div>

        <div id="dashboard" class="hidden">
            <h2>Start Boosting</h2>
            <input type="text" id="steam-user" placeholder="Steam Username">
            <input type="password" id="steam-pass" placeholder="Steam Password">
            <input type="text" id="game-ids" placeholder="AppIDs (e.g., 440, 570, 730)">
            <button onclick="startWorkflow()">Trigger GitHub Action</button>
            <p id="status"></p>
        </div>
    </div>

    <script>
        const SITE_PASSWORD = "your_chosen_password"; // Set your password here

        function checkPass() {
            if (document.getElementById('site-pass').value === SITE_PASSWORD) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } else {
                alert("Incorrect password");
            }
        }

        async function startWorkflow() {
            const status = document.getElementById('status');
            status.innerText = "Triggering Action...";
            
            // Note: You would typically call your backend here to keep 
            // your GitHub Token secure.
            alert("Workflow triggered. Go to GitHub Actions to enter your 2FA code.");
        }
    </script>
</body>
</html>
