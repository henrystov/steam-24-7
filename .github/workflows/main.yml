name: Steam Boost Manual
on:
  workflow_dispatch:
    inputs:
      steam_user:
        description: 'Steam Username'
        required: true
      games:
        description: 'AppIDs (comma separated)'
        required: true
        default: '440,570,730'

jobs:
  run-booster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install steam-user

      - name: Wait for 2FA Code
        id: get-2fa
        uses: step-security/wait-for-secrets@v1
        with:
          secrets: |
            STEAM_GUARD_CODE:
              description: "Enter 5-digit code from Email/App"

      - name: Run Script
        env:
          STEAM_USER: ${{ github.event.inputs.steam_user }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }} # Set this in GitHub Secrets
          STEAM_GUARD_CODE: ${{ steps.get-2fa.outputs.STEAM_GUARD_CODE }}
          GAMES: ${{ github.event.inputs.games }}
        run: node boost.js
